<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Orders</title>
</head>
<body>

	<h1>Orders</h1>

	<table border="1">
		<tr>
			<th>ID</th>
			<th>Coffee</th>
			<th>Status</th>
		</tr>

		<tr th:each="order : ${orders}">
			<td th:text="${order.id}"></td>
			<td th:text="${order.coffeeType}"></td>
			<td th:text="${order.status}"></td>
		</tr>

	</table>

	<br>

	<a href="/">Back</a>

</body>
</html>
